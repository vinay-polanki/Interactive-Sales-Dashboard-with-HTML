<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sales Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #upload { margin-bottom: 20px; }
        .chart-container { margin-bottom: 40px; }
    </style>
</head>
<body>
    <h2>Sales Performance Dashboard</h2>
    <input type="file" id="upload" accept="application/json">

    <div id="salesOverTime" class="chart-container"></div>
    <div id="profitByCategory" class="chart-container"></div>
    <div id="topCustomers" class="chart-container"></div>
    <div id="salesByRegion" class="chart-container"></div>
    <div id="discountVsProfit" class="chart-container"></div>

    <script>
        document.getElementById('upload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = JSON.parse(e.target.result);
                const salesData = Array.isArray(data) ? data : [data];
                generateDashboard(salesData);
            };
            reader.readAsText(file);
        });

        function generateDashboard(data) {
            const parseDate = d => new Date(d);

            // Sales Over Time
            const salesTimeMap = {};
            data.forEach(row => {
                const date = row['Order Date'];
                salesTimeMap[date] = (salesTimeMap[date] || 0) + row['Sales'];
            });
            const dates = Object.keys(salesTimeMap).sort((a, b) => new Date(a) - new Date(b));
            const sales = dates.map(d => salesTimeMap[d]);
            Plotly.newPlot('salesOverTime', [{ x: dates, y: sales, type: 'scatter', mode: 'lines+markers' }], { title: 'Sales Over Time' });

            // Profit by Category
            const profitByCat = {};
            data.forEach(row => {
                const cat = row['Category'];
                profitByCat[cat] = (profitByCat[cat] || 0) + row['Profit'];
            });
            Plotly.newPlot('profitByCategory', [{ x: Object.keys(profitByCat), y: Object.values(profitByCat), type: 'bar' }], { title: 'Profit by Category' });

            // Top 10 Customers by Sales
            const customerSales = {};
            data.forEach(row => {
                const name = row['Customer Name'];
                customerSales[name] = (customerSales[name] || 0) + row['Sales'];
            });
            const sortedCustomers = Object.entries(customerSales).sort((a, b) => b[1] - a[1]).slice(0, 10);
            Plotly.newPlot('topCustomers', [{
                x: sortedCustomers.map(c => c[1]),
                y: sortedCustomers.map(c => c[0]),
                type: 'bar',
                orientation: 'h'
            }], { title: 'Top 10 Customers by Sales' });

            // Sales by Region
            const regionSales = {};
            data.forEach(row => {
                const region = row['Region'];
                regionSales[region] = (regionSales[region] || 0) + row['Sales'];
            });
            Plotly.newPlot('salesByRegion', [{
                labels: Object.keys(regionSales),
                values: Object.values(regionSales),
                type: 'pie'
            }], { title: 'Sales by Region' });

            // Discount vs Profit Scatter
            Plotly.newPlot('discountVsProfit', [{
                x: data.map(d => d['Discount']),
                y: data.map(d => d['Profit']),
                mode: 'markers',
                type: 'scatter',
                marker: { size: 8 }
            }], { title: 'Discount vs Profit Scatter Plot', xaxis: { title: 'Discount' }, yaxis: { title: 'Profit' } });
        }
    </script>
</body>
</html>
